<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SF6 コンボアイコン作成ツール</title>
  <style>
    :root{
      --bg:#101116; --panel:#1b1e27; --panel2:#222634; --line:#353a48;
      --text:#f5f7fb; --muted:#aeb5c3; --accent:#4e9cff; --green:#36b37e;
      --danger:#ff5d5d; --orange:#ffb347; --purple:#9b7bff;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    header{max-width:980px;margin:auto;padding:16px 12px 6px}
    h1{font-size:20px;margin:0 0 6px} p{margin:0;color:var(--muted);font-size:13px}
    main{max-width:980px;margin:auto;padding:10px 12px 28px;display:grid;gap:12px}
    .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}
    .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
    button,.action{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:10px;padding:8px 11px;font-weight:800;cursor:pointer;font-size:13px}
    button:hover{filter:brightness(1.12);border-color:var(--accent)}
    .primary{background:#15579e;border-color:#367fd1}.save{background:#12643f;border-color:#279668}.copy{background:#5a3fb0;border-color:#8068e8}.danger{background:#703030;border-color:#b34b4b}.nav{background:#26344f;border-color:#4674ba}.nav.active{background:#0f5eaa;border-color:#62a9ff}.utility{background:#5b4a1b;border-color:#ad8730}
    .screen{display:none}.screen.active{display:grid;gap:12px}
    .meta{display:grid;grid-template-columns:auto minmax(130px,180px) auto minmax(140px,1fr) auto;gap:8px;align-items:center}
    label{font-size:13px;color:var(--muted);font-weight:800}
    select,input,textarea{width:100%;background:#11131a;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:14px}
    textarea{min-height:58px;resize:vertical}
    .input-area{display:flex;gap:12px;align-items:flex-start}
    .arrow-wrap{flex:0 0 min(38vw,190px)}.attack-wrap{flex:1}.side-tools{flex:0 0 70px;display:grid;gap:6px;margin-top:25px}
    .group-title{font-size:14px;font-weight:900;color:var(--muted);margin:0 0 8px}
    .arrow-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.attack-pad{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
    .icon-button{height:clamp(54px,8.2vw,72px);padding:3px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:#272b38}
    .icon-button img{width:clamp(28px,4.7vw,42px);height:clamp(28px,4.7vw,42px);object-fit:contain}.icon-button span{font-size:10px;color:var(--muted);line-height:1}.icon-button strong{font-size:clamp(15px,3.8vw,24px)}
    .tool-button{height:54px;background:#313547}.tool-button strong{font-size:16px}.tool-button span{font-size:10px;color:var(--muted);display:block}
    .output{min-height:78px;border:2px dashed #5b6277;border-radius:14px;background:#0b0c10;padding:10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;align-content:flex-start;overflow:visible}
    .output img,.mini-output img{width:42px;height:42px;object-fit:contain;flex:0 0 auto}.out-chip{width:42px;height:42px;border-radius:999px;background:#303443;border:1px solid #626a80;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px;flex:0 0 auto;white-space:pre-line;text-align:center;line-height:1.05}.separator{width:26px;background:transparent;border:0;font-size:26px}.newline{flex-basis:100%;height:0}.charged{padding:3px;border-radius:10px;background:linear-gradient(135deg,#fff176,#ffb300,#f57c00)}.charged img{display:block}.empty{color:#7f8797;font-size:14px}.hint{font-size:12px;color:var(--muted);margin-top:8px}.paste-grid{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end}
    .saved-list{display:grid;gap:10px}.combo-card{background:#151821;border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;gap:8px}.combo-head{display:flex;justify-content:space-between;gap:8px;align-items:center}.combo-title{font-weight:900}.combo-actions{display:flex;gap:6px;flex-wrap:wrap}.mini-output{display:flex;flex-wrap:wrap;gap:5px;align-items:center;background:#0c0d12;border-radius:10px;padding:8px;min-height:50px}.mini-output img{width:30px;height:30px}.mini-output .out-chip{width:30px;height:30px;font-size:11px}.mini-output .separator{width:18px;font-size:20px}
    @media(max-width:680px){header{padding-top:14px}main{padding:8px 10px 24px}.meta{grid-template-columns:42px 1fr;}.meta button{grid-column:1/-1}.input-area{gap:8px}.arrow-wrap{flex:0 0 32%}.side-tools{flex:0 0 58px}.attack-pad{grid-template-columns:repeat(4,1fr);gap:5px}.arrow-pad{gap:5px}.icon-button{height:56px}.tool-button{height:44px;padding:4px}.output img,.out-chip{width:38px;height:38px}.separator{width:22px}.paste-grid{grid-template-columns:1fr}.toolbar button{padding:8px 10px}}
  </style>
</head>
<body>
<header><h1>SF6 コンボアイコン作成ツール</h1><p>アイコン入力・テキスト貼り付け・保存済みコンボの並び替えができます。</p></header>
<main>
  <section class="panel toolbar">
    <button class="nav active" id="showCreate">作成画面</button>
    <button class="nav" id="showSaved">保存コンボ確認</button>
    <button class="utility" id="undoBtn">1つ戻す</button>
    <button class="danger" id="clearBtn">全部消す</button>
    <button class="copy" id="copyTextBtn">並びをコピー</button>
    <button class="copy" id="copyImageBtn">画像としてコピー</button>
  </section>

  <section class="screen active" id="createScreen">
    <section class="panel meta">
      <label>キャラ</label>
      <select id="character">
        <option>リュウ</option><option>ルーク</option><option>ジェイミー</option><option>春麗</option><option>ガイル</option><option>キンバリー</option><option>ジュリ</option><option>ケン</option><option>ブランカ</option><option>ダルシム</option><option>エドモンド本田</option><option>ディージェイ</option><option>マノン</option><option>マリーザ</option><option>JP</option><option>ザンギエフ</option><option>リリー</option><option>キャミィ</option><option>ラシード</option><option>A.K.I.</option><option>エド</option><option>豪鬼</option><option>ベガ</option><option>テリー</option><option>舞</option><option>エレナ</option><option>サガット</option>
      </select>
      <label>コンボ名</label><input id="comboName" placeholder="例: 小技始動 / 確反">
      <button class="save" id="saveBtn">コンボ保存</button>
    </section>

    <section class="panel">
      <div class="input-area">
        <div class="arrow-wrap"><div class="group-title">矢印</div><div class="arrow-pad" id="arrowPad"></div></div>
        <div class="attack-wrap"><div class="group-title">攻撃</div><div class="attack-pad" id="attackPad"></div></div>
        <div class="side-tools" id="sideTools"></div>
      </div>
    </section>

    <section class="panel">
      <div class="group-title">並びテキストから画像化</div>
      <div class="paste-grid">
        <textarea id="pasteText" placeholder="例: 下 弱P 弱P > 右下 下 右 中P&#10;※「並びをコピー」でコピーしたテキストを貼り付けできます"></textarea>
        <button class="primary" id="pasteBuildBtn">貼り付け内容を画像化</button>
      </div>
    </section>

    <section class="panel">
      <h2 style="font-size:15px;margin:0 0 9px">出力スペース</h2>
      <div class="output" id="output"><span class="empty">ここにアイコンが表示されます</span></div>
      <div class="hint" id="status">選択中: なし</div>
    </section>
  </section>

  <section class="screen" id="savedScreen">
    <section class="panel">
      <div class="toolbar" style="justify-content:space-between">
        <strong>保存済みコンボ</strong>
        <button class="danger" id="deleteAllBtn">保存コンボを全削除</button>
      </div>
      <div class="hint">↑↓でコンボの並び替えができます。</div>
    </section>
    <section class="saved-list" id="savedList"></section>
  </section>
</main>
<script>
const ASSET='assets/';
const arrows=[
 {label:'左上',file:'icon_8.png'},{label:'上',file:'icon_1.png'},{label:'右上',file:'icon_5.png'},
 {label:'左',file:'icon_7.png'},{label:'N',file:'icon_18.png'},{label:'右',file:'icon_6.png'},
 {label:'左下',file:'icon_4.png'},{label:'下',file:'icon_2.png'},{label:'右下',file:'icon_3.png'}
];
const attacks=[
 {label:'弱P',file:'icon_11.png'},{label:'中P',file:'icon_10.png'},{label:'強P',file:'icon_9.png'},{label:'P',file:'icon_15.png'},
 {label:'弱K',file:'icon_14.png'},{label:'中K',file:'icon_13.png'},{label:'強K',file:'icon_12.png'},{label:'K',file:'icon_16.png'},
 {label:'DP',text:'DP'},{label:'DI',text:'DI'},{label:'TC',text:'TC\n→'},{label:'>',text:'>',separator:true}
];
const tools=[{label:'改行',text:'↵',tool:'newline'},{label:'タメ',text:'タメ',tool:'charge'},{label:'Delay',text:'Delay',tool:'delay'}];
const allItems=[...arrows,...attacks];
const byLabel=Object.fromEntries(allItems.map(x=>[x.label,x]));
const output=document.getElementById('output'), status=document.getElementById('status');
let selected=[];
function cloneItem(item){return JSON.parse(JSON.stringify(item));}
function isArrow(item){return arrows.some(a=>a.label===item.label);}
function makeBtn(item){const b=document.createElement('button');b.type='button';b.className='icon-button'; if(item.file){b.innerHTML=`<img src="${ASSET}${item.file}" alt="${item.label}"><span>${item.label}</span>`}else{b.innerHTML=`<strong>${item.text}</strong><span>${item.label}</span>`} b.onclick=()=>addItem(cloneItem(item)); return b;}
function makeToolBtn(t){const b=document.createElement('button');b.type='button';b.className='tool-button';b.innerHTML=`<strong>${t.text}</strong><span>${t.label}</span>`;b.onclick=()=>runTool(t.tool);return b;}
arrows.forEach(i=>arrowPad.appendChild(makeBtn(i))); attacks.forEach(i=>attackPad.appendChild(makeBtn(i))); tools.forEach(i=>sideTools.appendChild(makeToolBtn(i)));
function render(){output.innerHTML=''; if(!selected.length){output.innerHTML='<span class="empty">ここにアイコンが表示されます</span>'}else selected.forEach(i=>appendVisual(output,i,false)); renderStatus();}
function appendVisual(parent,item,mini){ if(item.type==='newline'){const br=document.createElement('div');br.className='newline';parent.appendChild(br);return;} if(item.file){let wrap=document.createElement('div'); if(item.charged)wrap.className='charged'; const img=document.createElement('img');img.src=ASSET+item.file;img.alt=item.label;img.title=item.label; if(item.charged){wrap.appendChild(img);parent.appendChild(wrap)}else parent.appendChild(img); } else {const chip=document.createElement('div'); chip.className=item.separator?'out-chip separator':'out-chip'; chip.textContent=item.text; chip.title=item.label; parent.appendChild(chip);} }
function addItem(item){selected.push(item);render();}
function renderStatus(){status.textContent=selected.length?'選択中: '+selected.map(labelFor).join(' '):'選択中: なし'}
function labelFor(i){if(i.type==='newline')return '改行'; if(i.charged)return 'タメ'+i.label; return i.label;}
function runTool(tool){ if(tool==='newline'){selected.push({type:'newline',label:'改行'});} if(tool==='delay'){selected.push({label:'Delay',text:'Delay'});} if(tool==='charge'){ for(let i=selected.length-1;i>=0;i--){ if(isArrow(selected[i])){selected[i].charged=true; render(); return;} } selected.push({label:'タメ',text:'タメ'}); } render(); }
undoBtn.onclick=()=>{selected.pop();render()}; clearBtn.onclick=()=>{selected=[];render()};
copyTextBtn.onclick=async()=>{const t=selected.map(labelFor).join(' '); try{await navigator.clipboard.writeText(t);status.textContent=t?'コピーしました: '+t:'コピーするアイコンがありません'}catch(e){status.textContent='コピーに失敗しました。ブラウザ設定を確認してください。'}};
function parseText(text){const normalized=text.replace(/\r/g,'').replace(/\n/g,' 改行 '); const tokens=normalized.split(/\s+/).filter(Boolean); const result=[]; for(const raw of tokens){let token=raw.trim(); if(!token)continue; if(token==='改行'||token==='↵'){result.push({type:'newline',label:'改行'});continue;} if(token==='タメ'){result.push({label:'タメ',text:'タメ'});continue;} if(token.startsWith('タメ')&&byLabel[token.slice(2)]){let it=cloneItem(byLabel[token.slice(2)]);it.charged=true;result.push(it);continue;} if(token==='TC→'||token==='TC')token='TC'; if(token==='ディレイ')token='Delay'; if(byLabel[token]){result.push(cloneItem(byLabel[token]));continue;} result.push({label:token,text:token}); } return result;}
pasteBuildBtn.onclick=()=>{selected=parseText(pasteText.value);render();};
async function drawItemsToCanvas(items){const rows=[[]]; items.forEach(i=>{if(i.type==='newline')rows.push([]);else rows[rows.length-1].push(i)}); const size=48,gap=7,pad=12; const maxCols=Math.max(1,...rows.map(r=>r.length)); const w=Math.max(260,pad*2+maxCols*(size+gap)-gap); const h=pad*2+rows.length*size+(rows.length-1)*gap; const canvas=document.createElement('canvas'); const scale=2; canvas.width=w*scale;canvas.height=h*scale; const ctx=canvas.getContext('2d');ctx.scale(scale,scale);ctx.fillStyle='#0b0c10';ctx.fillRect(0,0,w,h);ctx.font='900 15px system-ui';ctx.textAlign='center';ctx.textBaseline='middle'; for(let r=0;r<rows.length;r++){for(let c=0;c<rows[r].length;c++){const item=rows[r][c],x=pad+c*(size+gap),y=pad+r*(size+gap); if(item.file){ if(item.charged){const g=ctx.createLinearGradient(x,y,x+size,y+size);g.addColorStop(0,'#fff176');g.addColorStop(.55,'#ffb300');g.addColorStop(1,'#f57c00');ctx.fillStyle=g;round(ctx,x,y,size,size,10);ctx.fill();} const img=await loadImg(ASSET+item.file);ctx.drawImage(img,x+4,y+4,size-8,size-8); }else{ctx.fillStyle=item.separator?'#0b0c10':'#303443';ctx.strokeStyle=item.separator?'#0b0c10':'#626a80';round(ctx,x,y,item.separator?28:size,size,999);ctx.fill();ctx.stroke();ctx.fillStyle='#f5f7fb';ctx.font=item.separator?'900 28px system-ui':'900 14px system-ui';(item.text||item.label).split('\n').forEach((line,idx,arr)=>ctx.fillText(line,x+(item.separator?14:size/2),y+size/2+(idx-(arr.length-1)/2)*15));}}} return canvas;}
function round(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function loadImg(src){return new Promise((res,rej)=>{const img=new Image();img.onload=()=>res(img);img.onerror=rej;img.src=src;});}
copyImageBtn.onclick=async()=>{if(!selected.length){status.textContent='画像化するアイコンがありません';return;} try{const canvas=await drawItemsToCanvas(selected); canvas.toBlob(async blob=>{try{await navigator.clipboard.write([new ClipboardItem({'image/png':blob})]); status.textContent='画像をコピーしました';}catch(e){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='sf6_combo.png';a.click();status.textContent='画像コピー非対応のためPNGを保存しました';}},'image/png');}catch(e){status.textContent='画像作成に失敗しました';}};
const KEY='sf6_saved_combos_v2'; function getSaved(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return[]}} function setSaved(x){localStorage.setItem(KEY,JSON.stringify(x))}
saveBtn.onclick=()=>{if(!selected.length){status.textContent='保存するコンボがありません';return;} const list=getSaved(); list.push({id:Date.now(),character:character.value,name:comboName.value||'名称なし',items:selected}); setSaved(list); status.textContent='保存しました'; renderSaved();};
function renderMini(parent,items){parent.innerHTML=''; if(!items.length){parent.textContent='空';return;} items.forEach(i=>appendVisual(parent,i,true));}
function renderSaved(){const list=getSaved(); savedList.innerHTML=''; if(!list.length){savedList.innerHTML='<section class="panel"><span class="empty">保存済みコンボはありません</span></section>';return;} list.forEach((combo,idx)=>{const card=document.createElement('div');card.className='combo-card'; const head=document.createElement('div');head.className='combo-head'; head.innerHTML=`<div><div class="combo-title">${escapeHtml(combo.character)} / ${escapeHtml(combo.name)}</div></div>`; const acts=document.createElement('div');acts.className='combo-actions'; [['↑','up'],['↓','down'],['読込','load'],['削除','del']].forEach(([txt,act])=>{const b=document.createElement('button');b.textContent=txt;b.onclick=()=>savedAction(act,idx);acts.appendChild(b)}); head.appendChild(acts); const mini=document.createElement('div');mini.className='mini-output'; renderMini(mini,combo.items||[]); card.appendChild(head);card.appendChild(mini); savedList.appendChild(card);});}
function savedAction(act,idx){const list=getSaved(); if(act==='up'&&idx>0){[list[idx-1],list[idx]]=[list[idx],list[idx-1]];setSaved(list);renderSaved();} if(act==='down'&&idx<list.length-1){[list[idx+1],list[idx]]=[list[idx],list[idx+1]];setSaved(list);renderSaved();} if(act==='del'){list.splice(idx,1);setSaved(list);renderSaved();} if(act==='load'){selected=JSON.parse(JSON.stringify(list[idx].items||[])); character.value=list[idx].character||character.value; comboName.value=list[idx].name||''; show('create');render();}}
function escapeHtml(s){return String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));}
deleteAllBtn.onclick=()=>{if(confirm('保存済みコンボを全て削除しますか？')){setSaved([]);renderSaved();}};
function show(which){createScreen.classList.toggle('active',which==='create');savedScreen.classList.toggle('active',which==='saved');showCreate.classList.toggle('active',which==='create');showSaved.classList.toggle('active',which==='saved'); if(which==='saved')renderSaved();}
showCreate.onclick=()=>show('create'); showSaved.onclick=()=>show('saved'); render(); renderSaved();
</script>
</body>
</html>
