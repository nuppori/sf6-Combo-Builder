<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SF6 コンボアイコン作成ツール</title>
  <style>
    :root { --bg:#111217; --panel:#1b1d25; --line:#333642; --text:#f4f5f7; --muted:#aeb4c0; --accent:#6aa7ff; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:var(--bg); color:var(--text); }
    header { padding:12px 10px 4px; max-width:980px; margin:auto; }
    h1 { font-size:18px; margin:0 0 4px; }
    p { margin:0; color:var(--muted); font-size:12px; }
    main { max-width:980px; margin:auto; padding:8px 10px 24px; display:grid; gap:10px; }
    .panel { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:10px; }
    .topbar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
    .topbar label { font-size:12px; color:var(--muted); font-weight:700; }
    select, input { background:#0f1118; color:var(--text); border:1px solid var(--line); border-radius:8px; padding:7px 8px; font-size:13px; }
    input { min-width:180px; }
    .action { border:1px solid var(--line); background:#262936; color:var(--text); padding:7px 10px; border-radius:9px; cursor:pointer; font-weight:800; font-size:12px; }
    .action:hover { border-color:var(--accent); }
    .primary { background:#21446e; border-color:#3d77b8; }
    .input-area { display:flex; gap:12px; align-items:flex-start; overflow-x:auto; padding-bottom:2px; }
    .pad-box { flex:0 0 auto; }
    .group-title { font-size:12px; font-weight:900; color:var(--muted); margin:0 0 6px; }
    .arrow-pad { display:grid; grid-template-columns:repeat(3, clamp(42px, 10.5vw, 58px)); gap:5px; }
    .attack-wrap { display:flex; gap:6px; align-items:stretch; }
    .attack-pad { display:grid; grid-template-columns:repeat(4, clamp(42px, 10.5vw, 58px)); gap:5px; }
    .utility-pad { display:grid; grid-template-columns:repeat(1, clamp(42px, 10.5vw, 58px)); gap:5px; }
    .icon-button { width:clamp(42px, 10.5vw, 58px); height:clamp(42px, 10.5vw, 58px); border:1px solid var(--line); border-radius:8px; background:#252833; color:var(--text); cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px; font-weight:900; padding:2px; }
    .icon-button:hover { outline:2px solid var(--accent); }
    .icon-button img { width:70%; height:70%; max-width:34px; max-height:34px; object-fit:contain; }
    .icon-button span { font-size:8.5px; line-height:1; color:var(--muted); white-space:nowrap; }
    .text-button strong { font-size:clamp(13px, 3.4vw, 18px); line-height:1; }
    .output { min-height:52px; border:2px dashed #555b6d; border-radius:12px; background:#0b0c10; padding:7px; display:flex; flex-wrap:wrap; gap:5px; align-items:center; overflow:visible; }
    .output img { width:24px; height:24px; object-fit:contain; flex:0 0 auto; }
    .out-chip { min-width:24px; height:24px; padding:0 5px; border-radius:999px; background:#303443; border:1px solid #565d70; display:flex; align-items:center; justify-content:center; font-weight:900; font-size:10px; flex:0 0 auto; }
    .separator { background:transparent; border:0; font-size:18px; min-width:16px; padding:0; }
    .charge-wrap { width:28px; height:28px; border-radius:8px; padding:2px; background:linear-gradient(135deg,#fff28a,#ffbf1f,#8b5a00); display:flex; align-items:center; justify-content:center; box-shadow:0 0 0 1px #ffe37a inset; flex:0 0 auto; }
    .charge-wrap img { width:24px; height:24px; }
    .line-break { flex-basis:100%; width:0; height:0; padding:0; margin:0; overflow:hidden; }
    .tc-mark { display:flex; flex-direction:column; align-items:center; justify-content:center; font-weight:900; line-height:1; }
    .tc-mark .tc { font-size:11px; }
    .tc-mark .arr { font-size:18px; margin-top:2px; }
    .empty { color:#7d8494; font-size:12px; }
    .hint { margin-top:7px; color:var(--muted); font-size:11px; }
    .screen { display:none; }
    .screen.active { display:grid; gap:10px; }
    .nav { margin-left:auto; }
    .saved-list { display:grid; gap:8px; }
    .combo-card { border:1px solid var(--line); border-radius:10px; padding:9px; background:#141620; display:grid; gap:7px; }
    .combo-head { display:flex; gap:8px; align-items:center; justify-content:space-between; }
    .combo-title { font-size:13px; font-weight:900; }
    .combo-meta { color:var(--muted); font-size:11px; }
    .combo-icons { display:flex; flex-wrap:wrap; gap:4px; overflow:visible; align-items:center; min-height:28px; }
    .combo-icons img { width:24px; height:24px; object-fit:contain; }
    .danger { background:#44232a; border-color:#70404a; }
    @media (max-width:560px) {
      header, main { padding-left:8px; padding-right:8px; }
      .input-area { gap:8px; }
      .arrow-pad { grid-template-columns:repeat(3, clamp(40px, 10.8vw, 48px)); }
      .attack-pad { grid-template-columns:repeat(4, clamp(40px, 10.8vw, 48px)); }
      .utility-pad { grid-template-columns:repeat(1, clamp(40px, 10.8vw, 48px)); }
      .icon-button { width:clamp(40px, 10.8vw, 48px); height:clamp(40px, 10.8vw, 48px); }
      .icon-button img { width:70%; height:70%; }
      input { min-width:140px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>SF6 コンボアイコン作成ツール</h1>
    <p>矢印と攻撃ボタンを押してコンボを作成し、キャラ別に保存できます。</p>
  </header>

  <main>
    <section class="panel topbar">
      <button class="action primary" id="editScreenBtn">作成画面</button>
      <button class="action" id="listScreenBtn">保存コンボ確認</button>
      <span class="nav"></span>
      <button class="action" id="undoBtn">1つ戻す</button>
      <button class="action" id="clearBtn">全部消す</button>
      <button class="action" id="copyTextBtn">並びをコピー</button>
      <button class="action" id="copyImageBtn">画像としてコピー</button>
    </section>

    <section id="editScreen" class="screen active">
      <section class="panel topbar">
        <label>キャラ</label>
        <select id="characterSelect">
          <option>リュウ</option><option>ルーク</option><option>ジェイミー</option><option>春麗</option><option>ガイル</option><option>キンバリー</option><option>ジュリ</option><option>ケン</option><option>ブランカ</option><option>ダルシム</option><option>エドモンド本田</option><option>ディージェイ</option><option>マノン</option><option>マリーザ</option><option>JP</option><option>ザンギエフ</option><option>リリー</option><option>キャミィ</option><option>ラシード</option><option>A.K.I.</option><option>エド</option><option>豪鬼</option><option>ベガ</option><option>テリー</option><option>舞</option><option>エレナ</option><option>サガット</option><option>C.ヴァイパー</option><option>アレックス</option><option>イングリッド</option>
        </select>
        <label>コンボ名</label>
        <input id="comboName" placeholder="例: 小技始動 / 確反" />
        <button class="action primary" id="saveBtn">コンボ保存</button>
      </section>

      <section class="panel">
        <div class="input-area">
          <div class="pad-box">
            <div class="group-title">矢印</div>
            <div class="arrow-pad" id="arrowPad"></div>
          </div>
          <div class="pad-box">
            <div class="group-title">攻撃</div>
            <div class="attack-wrap"><div class="attack-pad" id="attackPad"></div><div class="utility-pad" id="utilityPad"></div></div>
          </div>
        </div>
      </section>

      <section class="panel">
        <h2 style="font-size:14px; margin:0 0 7px;">出力スペース</h2>
        <div class="output" id="output"><span class="empty">ここにアイコンが横並びで表示されます</span></div>
        <div class="hint" id="status">選択中: なし</div>
      </section>
    </section>

    <section id="listScreen" class="screen">
      <section class="panel topbar">
        <label>表示キャラ</label>
        <select id="filterCharacter"></select>
        <button class="action danger" id="deleteAllBtn">保存を全削除</button>
      </section>
      <section class="panel">
        <h2 style="font-size:14px; margin:0 0 8px;">保存したコンボ</h2>
        <div class="saved-list" id="savedList"></div>
      </section>
    </section>
  </main>

  <script>
    const STORAGE_KEY = 'sf6SavedCombosV1';
    const arrows = [
      { label:'左上', file:'icon_8.png', type:'arrow' }, { label:'上', file:'icon_1.png', type:'arrow' }, { label:'右上', file:'icon_5.png', type:'arrow' },
      { label:'左', file:'icon_7.png', type:'arrow' }, { label:'N', file:'icon_18.png', type:'arrow' }, { label:'右', file:'icon_6.png', type:'arrow' },
      { label:'左下', file:'icon_4.png', type:'arrow' }, { label:'下', file:'icon_2.png', type:'arrow' }, { label:'右下', file:'icon_3.png', type:'arrow' },
    ];
    const attacks = [
      { label:'弱P', file:'icon_11.png', type:'attack' }, { label:'中P', file:'icon_10.png', type:'attack' }, { label:'強P', file:'icon_9.png', type:'attack' }, { label:'P', file:'icon_15.png', type:'attack' },
      { label:'弱K', file:'icon_14.png', type:'attack' }, { label:'中K', file:'icon_13.png', type:'attack' }, { label:'強K', file:'icon_12.png', type:'attack' }, { label:'K', file:'icon_16.png', type:'attack' },
      { label:'DP', text:'DP', type:'system' }, { label:'DI', text:'DI', type:'system' }, { label:'TC', text:'TC→', tc:true, type:'system' }, { label:'>', text:'>', separator:true, type:'system' },
    ];
    const utilities = [
      { label:'改行', text:'↵', action:'newline' },
      { label:'タメ', text:'タメ', action:'charge' },
      { label:'ディレイ', text:'Delay', action:'delay' },
    ];
    const selected = [];
    const arrowPad = document.getElementById('arrowPad');
    const attackPad = document.getElementById('attackPad');
    const utilityPad = document.getElementById('utilityPad');
    const output = document.getElementById('output');
    const status = document.getElementById('status');
    const characterSelect = document.getElementById('characterSelect');
    const filterCharacter = document.getElementById('filterCharacter');

    function allCharacters() { return [...characterSelect.options].map(o => o.value); }
    function loadCombos() { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); }
    function saveCombos(combos) { localStorage.setItem(STORAGE_KEY, JSON.stringify(combos)); }
    function renderStatus(msg) { status.textContent = msg || (selected.length ? `選択中: ${selected.map(x => x.label).join(' ')}` : '選択中: なし'); }
    function removeEmptyText() { const empty = output.querySelector('.empty'); if (empty) empty.remove(); }
    function renderToken(parent, item) {
      if (item.action === 'newline') {
        const br = document.createElement('div'); br.className = 'line-break'; parent.appendChild(br); return;
      }
      if (item.file) {
        const img = document.createElement('img'); img.src = `assets/${item.file}`; img.alt = item.label; img.title = item.label;
        if (item.charged) { const wrap = document.createElement('div'); wrap.className = 'charge-wrap'; wrap.title = item.label + '（タメ）'; wrap.appendChild(img); parent.appendChild(wrap); }
        else parent.appendChild(img);
      } else {
        const chip = document.createElement('div'); chip.className = item.separator ? 'out-chip separator' : 'out-chip';
        if (item.tc) chip.innerHTML = '<span class="tc-mark"><span class="tc">TC</span><span class="arr">→</span></span>'; else chip.textContent = item.text;
        chip.title = item.label; parent.appendChild(chip);
      }
    }
    function rerenderOutput() { output.innerHTML = ''; if (!selected.length) { clearOutput(); return; } selected.forEach(i => renderToken(output, i)); renderStatus(); }
    function addItem(item) { removeEmptyText(); selected.push({...item}); renderToken(output, item); renderStatus(); }
    function addUtility(item) {
      if (item.action === 'charge') {
        const last = selected[selected.length - 1];
        if (last && last.type === 'arrow' && last.label !== 'N') { last.charged = true; rerenderOutput(); renderStatus('直前の矢印をタメにしました'); }
        else { selected.push({ label:'タメ', text:'タメ', type:'system' }); rerenderOutput(); }
        return;
      }
      if (item.action === 'newline') { addItem({ label:'改行', action:'newline', type:'system' }); return; }
      if (item.action === 'delay') { addItem({ label:'ディレイ', text:'Delay', type:'system' }); return; }
    }
    function makeButton(item) {
      const btn = document.createElement('button'); btn.className = 'icon-button'; btn.type = 'button';
      btn.innerHTML = item.file ? `<img src="assets/${item.file}" alt="${item.label}"><span>${item.label}</span>` : (item.tc ? `<strong>TC</strong><span>→</span>` : `<strong>${item.text}</strong><span>${item.label}</span>`);
      if (!item.file) btn.classList.add('text-button');
      btn.addEventListener('click', () => addItem(item)); return btn;
    }
    function clearOutput() { selected.length = 0; output.innerHTML = '<span class="empty">ここにアイコンが横並びで表示されます</span>'; renderStatus(); }
    function switchScreen(name) {
      document.getElementById('editScreen').classList.toggle('active', name === 'edit');
      document.getElementById('listScreen').classList.toggle('active', name === 'list');
      document.getElementById('editScreenBtn').classList.toggle('primary', name === 'edit');
      document.getElementById('listScreenBtn').classList.toggle('primary', name === 'list');
      if (name === 'list') renderSavedList();
    }
    function setupFilter() {
      filterCharacter.innerHTML = '<option value="__all">全キャラ</option>' + allCharacters().map(c => `<option>${c}</option>`).join('');
    }
    function renderSavedList() {
      const list = document.getElementById('savedList'); list.innerHTML = '';
      const filter = filterCharacter.value || '__all';
      const combos = loadCombos().filter(c => filter === '__all' || c.character === filter);
      if (!combos.length) { list.innerHTML = '<p class="empty">保存済みコンボはありません。</p>'; return; }
      combos.slice().reverse().forEach(combo => {
        const card = document.createElement('div'); card.className = 'combo-card';
        const head = document.createElement('div'); head.className = 'combo-head';
        head.innerHTML = `<div><div class="combo-title">${combo.name || '無題コンボ'}</div><div class="combo-meta">${combo.character}</div></div>`;
        const del = document.createElement('button'); del.className = 'action danger'; del.textContent = '削除';
        del.onclick = () => { saveCombos(loadCombos().filter(c => c.id !== combo.id)); renderSavedList(); };
        head.appendChild(del); card.appendChild(head);
        const icons = document.createElement('div'); icons.className = 'combo-icons'; combo.items.forEach(i => renderToken(icons, i)); card.appendChild(icons);
        const text = document.createElement('div'); text.className = 'combo-meta'; text.textContent = combo.items.map(i => i.label).join(' '); card.appendChild(text);
        list.appendChild(card);
      });
    }

    arrows.forEach(i => arrowPad.appendChild(makeButton(i)));
    attacks.forEach(i => attackPad.appendChild(makeButton(i)));
    utilities.forEach(i => { const b = makeButton(i); b.onclick = () => addUtility(i); utilityPad.appendChild(b); });
    setupFilter();


    async function loadImage(src) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = reject;
        img.src = src;
      });
    }
    function roundRect(ctx, x, y, w, h, r) {
      const rr = Math.min(r, w / 2, h / 2);
      ctx.beginPath();
      ctx.moveTo(x + rr, y);
      ctx.arcTo(x + w, y, x + w, y + h, rr);
      ctx.arcTo(x + w, y + h, x, y + h, rr);
      ctx.arcTo(x, y + h, x, y, rr);
      ctx.arcTo(x, y, x + w, y, rr);
      ctx.closePath();
    }
    async function copyOutputAsImage() {
      if (!selected.length) return renderStatus('コピーするアイコンがありません');
      const gap = 8, icon = 32, pad = 12;
      const maxWidth = Math.min(900, Math.max(280, output.clientWidth || 360));
      const rows = [[]]; let rowW = 0;
      selected.forEach(item => {
        if (item.action === 'newline') { if (rows[rows.length - 1].length) rows.push([]); rowW = 0; return; }
        const w = item.file ? icon : (item.separator ? 18 : 48);
        if (rowW && rowW + gap + w > maxWidth - pad * 2) { rows.push([]); rowW = 0; }
        rows[rows.length - 1].push({ item, w });
        rowW += (rowW ? gap : 0) + w;
      });
      const usedRows = rows.filter(r => r.length);
      const width = Math.max(160, Math.min(maxWidth, Math.max(...usedRows.map(r => r.reduce((a,b)=>a+b.w,0) + gap * Math.max(0, r.length - 1)), 0) + pad * 2));
      const height = pad * 2 + usedRows.length * icon + Math.max(0, usedRows.length - 1) * gap;
      const canvas = document.createElement('canvas');
      const dpr = Math.max(1, window.devicePixelRatio || 1);
      canvas.width = Math.ceil(width * dpr); canvas.height = Math.ceil(height * dpr);
      canvas.style.width = `${width}px`; canvas.style.height = `${height}px`;
      const ctx = canvas.getContext('2d'); ctx.scale(dpr, dpr);
      ctx.fillStyle = '#0b0c10'; roundRect(ctx, 0, 0, width, height, 12); ctx.fill();
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.font = '900 14px system-ui, sans-serif';
      let y = pad;
      for (const row of usedRows) {
        let x = pad;
        for (const { item, w } of row) {
          if (item.file) {
            if (item.charged) {
              const g = ctx.createLinearGradient(x, y, x + icon, y + icon);
              g.addColorStop(0, '#fff28a'); g.addColorStop(.55, '#ffbf1f'); g.addColorStop(1, '#8b5a00');
              ctx.fillStyle = g; roundRect(ctx, x, y, icon, icon, 8); ctx.fill();
              const img = await loadImage(`assets/${item.file}`); ctx.drawImage(img, x + 4, y + 4, icon - 8, icon - 8);
            } else {
              const img = await loadImage(`assets/${item.file}`); ctx.drawImage(img, x, y, icon, icon);
            }
          } else {
            ctx.fillStyle = item.separator ? 'transparent' : '#303443';
            if (!item.separator) { roundRect(ctx, x, y + 2, w, icon - 4, 999); ctx.fill(); ctx.strokeStyle = '#565d70'; ctx.stroke(); }
            ctx.fillStyle = '#f4f5f7';
            if (item.tc) { ctx.font = '900 11px system-ui, sans-serif'; ctx.fillText('TC', x + w/2, y + 11); ctx.font = '900 18px system-ui, sans-serif'; ctx.fillText('→', x + w/2, y + 23); }
            else { ctx.font = item.separator ? '900 22px system-ui, sans-serif' : '900 12px system-ui, sans-serif'; ctx.fillText(item.text || item.label, x + w/2, y + icon/2); }
          }
          x += w + gap;
        }
        y += icon + gap;
      }
      const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
      try {
        await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
        renderStatus('出力スペースを画像としてコピーしました');
      } catch (e) {
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'sf6_combo.png'; a.click();
        renderStatus('画像コピーに未対応のため、PNGを保存しました');
      }
    }

    document.getElementById('editScreenBtn').onclick = () => switchScreen('edit');
    document.getElementById('listScreenBtn').onclick = () => switchScreen('list');
    document.getElementById('undoBtn').onclick = () => { selected.pop(); rerenderOutput(); };
    document.getElementById('clearBtn').onclick = clearOutput;
    document.getElementById('copyTextBtn').onclick = async () => { const text = selected.map(x => x.label).join(' '); await navigator.clipboard.writeText(text); renderStatus(text ? `コピーしました: ${text}` : 'コピーするアイコンがありません'); };
    document.getElementById('copyImageBtn').onclick = copyOutputAsImage;
    document.getElementById('saveBtn').onclick = () => {
      if (!selected.length) return renderStatus('保存するコンボがありません');
      const combos = loadCombos();
      combos.push({ id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now()), character: characterSelect.value, name: document.getElementById('comboName').value.trim(), items: selected.map(x => ({...x})), createdAt: new Date().toISOString() });
      saveCombos(combos); renderStatus('保存しました'); document.getElementById('comboName').value = ''; clearOutput();
    };
    filterCharacter.onchange = renderSavedList;
    document.getElementById('deleteAllBtn').onclick = () => { if (confirm('保存したコンボをすべて削除しますか？')) { saveCombos([]); renderSavedList(); } };
  </script>
</body>
</html>
